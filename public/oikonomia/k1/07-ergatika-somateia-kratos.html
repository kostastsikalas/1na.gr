<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Το Εργατικό Σωματείο & Το Κράτος - Πολιτική Οικονομία</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: white;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .app {
        width: 100%;
        max-width: 850px;
        text-align: center;
    }

    h1 {
        font-size: 30px;
        margin-bottom: 8px;
    }

    .subtitle {
        color: #cbd5e1;
        margin-bottom: 25px;
        font-size: 17px;
    }

    .progress-container {
        width: 100%;
        height: 8px;
        background: #334155;
        border-radius: 10px;
        margin-bottom: 15px;
        overflow: hidden;
    }

    .progress {
        height: 100%;
        width: 10%;
        background: #38bdf8;
        transition: width 0.3s ease;
    }

    .counter {
        color: #cbd5e1;
        margin-bottom: 15px;
        font-size: 15px;
    }

    .card-container {
        perspective: 1200px;
        width: 100%;
        height: 450px;
    }

    .card {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.6s;
        cursor: pointer;
    }

    .card.no-flip {
        cursor: default;
    }

    .card.flipped {
        transform: rotateY(180deg);
    }

    .card-side {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 22px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 35px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.35);
        overflow-y: auto;
    }

    .front {
        background: linear-gradient(145deg, #2563eb, #1d4ed8);
    }

    .back {
        background: linear-gradient(145deg, #0f766e, #115e59);
        transform: rotateY(180deg);
    }

    .end-card-style {
        background: linear-gradient(145deg, #0284c7, #0369a1) !important;
    }

    .label {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 2px;
        opacity: 0.8;
        margin-bottom: 20px;
    }

    .question {
        font-size: 26px;
        line-height: 1.4;
        font-weight: bold;
    }

    .answer {
        font-size: 19px;
        line-height: 1.55;
        text-align: left;
        width: 100%;
    }

    .answer-center {
        text-align: center;
    }

    .hint {
        position: absolute;
        bottom: 18px;
        font-size: 13px;
        opacity: 0.7;
    }

    .buttons {
        margin-top: 25px;
        display: flex;
        justify-content: center;
        gap: 15px;
    }

    button {
        border: none;
        border-radius: 12px;
        padding: 13px 25px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        transform: translateY(-2px);
    }

    .prev {
        background: #475569;
        color: white;
    }

    .next {
        background: #38bdf8;
        color: #082f49;
    }

    .reset {
        background: #e2e8f0;
        color: #0f172a;
    }

    .tip {
        margin-top: 20px;
        color: #94a3b8;
        font-size: 14px;
    }

    @media (max-width: 600px) {
        h1 {
            font-size: 24px;
        }

        .card-container {
            height: 420px;
        }

        .question {
            font-size: 21px;
        }

        .answer {
            font-size: 16px;
        }

        .card-side {
            padding: 20px;
        }

        button {
            padding: 11px 17px;
            font-size: 14px;
        }
    }
</style>
</head>

<body>

<div class="app">

    <h1>🤝 Το Εργατικό Σωματείο & Το Κράτος</h1>

    <div class="subtitle">
        Flash Cards – Πολιτική Οικονομία
    </div>

    <div class="progress-container">
        <div class="progress" id="progress"></div>
    </div>

    <div class="counter" id="counter">
        Κάρτα 1 από 9
    </div>

    <div class="card-container">

        <div class="card" id="card" onclick="flipCard()">

            <!-- ΜΠΡΟΣΤΑ -->
            <div class="card-side front" id="frontSide">

                <div class="label" id="frontLabel">
                    Ερώτηση
                </div>

                <div class="question" id="question">
                    Φόρτωση...
                </div>

                <div class="hint" id="hint">
                    👆 Κάνε κλικ για να δεις την απάντηση
                </div>

            </div>

            <!-- ΠΙΣΩ -->
            <div class="card-side back">

                <div class="label" id="backLabel">
                    Απάντηση
                </div>

                <div class="answer" id="answer">
                    Φόρτωση...
                </div>

            </div>

        </div>

    </div>

    <div class="buttons">

        <button class="prev" onclick="previousCard(event)">
            ← Προηγούμενη
        </button>

        <button class="reset" onclick="resetCard(event)">
            ↻ Επανάληψη
        </button>

        <button class="next" onclick="nextCard(event)">
            Επόμενη →
        </button>

    </div>

    <div class="tip" id="tipMessage">
        💡 Προσπάθησε να απαντήσεις πριν γυρίσεις την κάρτα.
    </div>

</div>

<script>

const cards = [
    {
        question: "(iii) Τι είναι τα εργατικά σωματεία και ποιος είναι ο αντικειμενικός σκοπός τους;",
        answer: "• Είναι <strong>οργανώσεις εργαζομένων</strong>.<br><br>• <strong>Σκοπός τους:</strong> Η προώθηση των κοινών συμφερόντων των μελών τους και συγκεκριμένα η <strong>βελτίωση της οικονομικής τους κατάστασης</strong>."
    },
    {
        question: "Πότε εμφανίστηκαν τα εργατικά σωματεία και ποιες συνθήκες τα δημιούργησαν;",
        answer: "• Εμφανίστηκαν στο <strong>τέλος του 18ου αιώνα</strong> με την εξάπλωση της <strong>Βιομηχανικής Επανάστασης</strong> στην Αγγλία.<br><br>• <strong>Συνθήκες:</strong> Η μετακίνηση του αγροτικού πληθυσμού στις βιομηχανικές περιοχές δημιούργησε μια πολυάριθμη τάξη εργατών, με μοναδική πηγή εισοδήματος την αμοιβή τους από τη βιομηχανία."
    },
    {
        question: "Ποιοι ήταν οι κύριοι παράγοντες που ώθησαν τους εργάτες στη δημιουργία επαγγελματικών ενώσεων;",
        answer: "1️⃣ Το αίσθημα <strong>ανασφάλειας</strong> (λόγω έλλειψης άλλων μέσων συντήρησης).<br>2️⃣ Το ενδεχόμενο της <strong>ανεργίας</strong>.<br><br>👉 Ο μεμονωμένος εργάτης δεν έχει δύναμη απέναντι στον εργοδότη, ο οποίος μπορεί να επιβάλει όρους με την απειλή της απόλυσης."
    },
    {
        question: "Ποιος είναι ο ρόλος του σωματείου στις διαπραγματεύσεις με τον εργοδότη;",
        answer: "• Επιτρέπει τη <strong>συλλογική διαπραγμάτευση</strong> με τον εργοδότη για την εξασφάλιση καλύτερων όρων απασχόλησης.<br><br>• Λειτουργεί ως <strong>αντιστάθμισμα στην οικονομική δύναμη του εργοδότη</strong>, αξιοποιώντας τη δύναμη της συλλογικής δράσης."
    },
    {
        question: "Ποιες εναλλακτικές ονομασίες χρησιμοποιούνται αντί του όρου «εργατικό σωματείο»;",
        answer: "• <strong>Εργατική ένωση</strong><br>• <strong>Εργατικό συνδικάτο</strong> (από τη γαλλική λέξη <i>syndicat</i> και την αγγλική <i>syndicate</i>, που προέρχονται από την ελληνική λέξη <i>σύνδικος</i>)."
    },
    {
        question: "(iv) Πώς ορίζεται το Κράτος και ποιος ο ρόλος του στην οικονομική ζωή;",
        answer: "• Είναι η <strong>ισχυρότερη συλλογική οντότητα</strong>.<br><br>• Η συμπεριφορά του επηρεάζει σε σημαντικό βαθμό την οικονομική ζωή της χώρας, καθώς και τις αποφάσεις των <u>επιχειρήσεων</u> και των <u>νοικοκυριών</u>."
    },
    {
        question: "Πώς παρεμβαίνει το Κράτος στις επιχειρήσεις και στα νοικοκυριά;",
        answer: "• <strong>Στις επιχειρήσεις:</strong> Με την επιβολή φορολογίας και την παροχή διάφορων διευκολύνσεων.<br><br>• <strong>Στα νοικοκυριά:</strong> Με την επιβολή φόρων, την παροχή επιδομάτων και τη διάθεση αγαθών."
    },
    {
        question: "Ποιες παραγωγικές λειτουργίες ασκεί το Κράτος για τους πολίτες;",
        answer: "• Ασκεί παραγωγικές λειτουργίες για τη <strong>«δωρεάν» παροχή βασικών αγαθών</strong> και υπηρεσιών στους πολίτες.<br><br>👉 <i>Παραδείγματα:</i> Προστασία, Παιδεία, Περίθαλψη."
    },
    {
        isEndCard: true,
        question: "🎉 Ευχαριστώ για την παρακολούθηση!<br><br><span style='font-size:22px; font-weight:normal;'>Ερωτοκριτάκης Κώστας - <strong>Οικονομολόγος</strong></span>",
        answer: "🎉 Ευχαριστώ για την παρακολούθηση!<br><br><span style='font-size:22px; font-weight:normal;'>Ερωτοκριτάκης Κώστας - <strong>Οικονομολόγος</strong></span>"
    }
];

let currentCard = 0;

const card = document.getElementById("card");
const frontSide = document.getElementById("frontSide");
const question = document.getElementById("question");
const answer = document.getElementById("answer");
const counter = document.getElementById("counter");
const progress = document.getElementById("progress");
const frontLabel = document.getElementById("frontLabel");
const hint = document.getElementById("hint");
const tipMessage = document.getElementById("tipMessage");

function updateCard() {
    card.classList.remove("flipped");

    const currentData = cards[currentCard];

    question.innerHTML = currentData.question;
    answer.innerHTML = currentData.answer;

    if (currentData.isEndCard) {
        answer.classList.add("answer-center");
    } else {
        answer.classList.remove("answer-center");
    }

    counter.innerHTML = "Κάρτα " + (currentCard + 1) + " από " + cards.length;

    const percentage = ((currentCard + 1) / cards.length) * 100;
    progress.style.width = percentage + "%";

    if (currentData.isEndCard) {
        frontLabel.style.display = "none";
        hint.style.display = "none";
        tipMessage.style.visibility = "hidden";
        card.classList.add("no-flip");
        frontSide.classList.add("end-card-style");
    } else {
        frontLabel.style.display = "block";
        hint.style.display = "block";
        tipMessage.style.visibility = "visible";
        card.classList.remove("no-flip");
        frontSide.classList.remove("end-card-style");
    }
}

function flipCard() {
    if (!cards[currentCard].isEndCard) {
        card.classList.toggle("flipped");
    }
}

function nextCard(event) {
    if (event) event.stopPropagation();
    currentCard++;
    if (currentCard >= cards.length) {
        currentCard = 0;
    }
    updateCard();
}

function previousCard(event) {
    if (event) event.stopPropagation();
    currentCard--;
    if (currentCard < 0) {
        currentCard = cards.length - 1;
    }
    updateCard();
}

function resetCard(event) {
    if (event) event.stopPropagation();
    currentCard = 0;
    updateCard();
}

updateCard();

</script>

</body>
</html>
