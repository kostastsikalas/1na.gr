<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Οικονομικές Ανάγκες</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f5f8;
  color: #1f2937;
}

.flashcard-app {
  max-width: 760px;
  margin: 30px auto;
  padding: 20px;
}

.title {
  text-align: center;
  margin-bottom: 8px;
  font-size: 30px;
  font-weight: 700;
}

.subtitle {
  text-align: center;
  color: #64748b;
  margin-bottom: 25px;
}

.progress-text {
  text-align: center;
  font-size: 15px;
  margin-bottom: 10px;
  color: #475569;
}

.progress-container {
  width: 100%;
  height: 8px;
  background: #dbe2ea;
  border-radius: 20px;
  overflow: hidden;
  margin-bottom: 25px;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #2563eb;
  transition: width 0.3s ease;
}


/* CARD */

.card-container {
  perspective: 1200px;
  height: 390px;
}

.card {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform 0.65s;
  transform-style: preserve-3d;
  cursor: pointer;
}

.card.flipped {
  transform: rotateY(180deg);
}

.card-side {
  position: absolute;
  width: 100%;
  height: 100%;
  padding: 35px;
  border-radius: 22px;
  backface-visibility: hidden;
  box-shadow: 0 12px 35px rgba(0,0,0,0.12);
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.card-front {
  background: white;
  border-top: 7px solid #2563eb;
}

.card-back {
  background: #172554;
  color: white;
  transform: rotateY(180deg);
}

.card-number {
  position: absolute;
  top: 20px;
  left: 25px;
  font-size: 14px;
  font-weight: bold;
  color: #64748b;
}

.card-back .card-number {
  color: #bfdbfe;
}

.icon {
  text-align: center;
  font-size: 52px;
  margin-bottom: 20px;
}

.question {
  font-size: 27px;
  line-height: 1.35;
  font-weight: 700;
  text-align: center;
}

.answer {
  font-size: 20px;
  line-height: 1.6;
  text-align: center;
}

.answer strong {
  color: #fde68a;
}

.example {
  margin-top: 20px;
  background: rgba(255,255,255,0.12);
  padding: 14px 18px;
  border-radius: 12px;
  font-size: 17px;
}

.flip-hint {
  position: absolute;
  bottom: 18px;
  width: calc(100% - 70px);
  text-align: center;
  font-size: 14px;
  opacity: 0.65;
}


/* ΤΕΛΙΚΗ ΚΑΡΤΑ */

.final-card {
  cursor: default;
}

.final-card .card-front {
  background: #172554;
  color: white;
  border-top: 7px solid #38bdf8;
}

.final-card .card-number {
  color: #bfdbfe;
}

.final-card .icon {
  font-size: 65px;
}

.final-card .question {
  font-size: 30px;
  line-height: 1.5;
}

.final-card .flip-hint {
  display: none;
}


/* BUTTONS */

.controls {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 25px;
}

button {
  border: none;
  padding: 13px 22px;
  border-radius: 12px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

.prev-btn {
  background: #e2e8f0;
  color: #334155;
}

.flip-btn {
  background: #2563eb;
  color: white;
}

.next-btn {
  background: #0f172a;
  color: white;
}

button:hover {
  transform: translateY(-2px);
  opacity: 0.9;
}

.memory-box {
  margin-top: 25px;
  background: #fff7ed;
  border-left: 5px solid #f97316;
  padding: 16px;
  border-radius: 10px;
  font-size: 16px;
}


@media(max-width: 600px) {

  .card-container {
    height: 430px;
  }

  .question {
    font-size: 23px;
  }

  .answer {
    font-size: 18px;
  }

  .controls {
    flex-wrap: wrap;
  }

  button {
    flex: 1;
  }

}

</style>
</head>


<body>

<div class="flashcard-app">

  <div class="title">
    🧠 Οικονομικές Ανάγκες
  </div>

  <div class="subtitle">
    Πάτησε πάνω στην κάρτα για να εμφανιστεί η απάντηση
  </div>

  <div class="progress-text" id="progressText"></div>

  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>


  <div class="card-container">

    <div class="card" id="flashcard">

      <div class="card-side card-front">

        <div class="card-number" id="frontNumber"></div>

        <div class="icon" id="cardIcon"></div>

        <div class="question" id="question"></div>

        <div class="flip-hint">
          👆 Πάτησε για να δεις την απάντηση
        </div>

      </div>


      <div class="card-side card-back">

        <div class="card-number" id="backNumber"></div>

        <div class="answer" id="answer"></div>

        <div class="flip-hint">
          👆 Πάτησε ξανά για επιστροφή
        </div>

      </div>

    </div>

  </div>


  <div class="controls">

    <button class="prev-btn" onclick="previousCard()">
      ← Προηγούμενη
    </button>

    <button class="flip-btn" id="flipButton" onclick="flipCard(event)">
      🔄 Απάντηση
    </button>

    <button class="next-btn" onclick="nextCard()">
      Επόμενη →
    </button>

  </div>


  <div class="memory-box" id="memoryBox">
    💡 <strong>Μνημονικό:</strong>
    Οι ανάγκες <strong>Εξελίσσονται – Πολλαπλασιάζονται – Κορέννυνται.</strong>
  </div>

</div>


<script>


const cards = [

{
  icon: "💡",

  question: "Τι είναι οι οικονομικές ανάγκες;",

  answer: `
  Οι ανάγκες για την ικανοποίηση των οποίων χρησιμοποιούνται
  <strong>οικονομικά αγαθά</strong>.
  `
},


{
  icon: "🧠",

  question: "Ποιες είναι οι τρεις βασικές ιδιότητες των αναγκών;",

  answer: `
  <strong>1. Εξέλιξη</strong><br>
  <strong>2. Πολλαπλασιασμός</strong><br>
  <strong>3. Κορεσμός</strong>
  `
},


{
  icon: "🔄",

  question: "Τι σημαίνει εξέλιξη των αναγκών;",

  answer: `
  Είναι η <strong>διαφοροποίηση των αγαθών</strong>
  που χρησιμοποιούνται για την ικανοποίηση της ίδιας ανάγκης.

  <div class="example">
  🔥 Φωτιά → 🪵 Σόμπα → ♨️ Καλοριφέρ → ❄️ Κλιματιστικό
  </div>
  `
},


{
  icon: "➕",

  question: "Τι σημαίνει πολλαπλασιασμός των αναγκών;",

  answer: `
  Σημαίνει <strong>δημιουργία νέων αναγκών</strong>.

  <div class="example">
  📺 Παράδειγμα: Η ανάγκη για τηλεόραση δεν υπήρχε παλαιότερα,
  ενώ σήμερα είναι πολύ συνηθισμένη.
  </div>
  `
},


{
  icon: "4️⃣",

  question: "Ποιοι είναι οι τέσσερις βασικοί παράγοντες που επηρεάζουν την εξέλιξη και τον πολλαπλασιασμό των αναγκών;",

  answer: `
  💻 <strong>Τεχνολογία</strong><br>
  👥 <strong>Μίμηση</strong><br>
  🔁 <strong>Συνήθεια</strong><br>
  📢 <strong>Διαφήμιση</strong>

  <div class="example">
  🧠 Μνημονικό: ΤΕ – ΜΙ – ΣΥ – ΔΙΑ
  </div>
  `
},


{
  icon: "💻",

  question: "Πώς επηρεάζει η τεχνολογία τις ανάγκες;",

  answer: `
  Η τεχνολογική πρόοδος δημιουργεί νέα προϊόντα.

  <br><br>

  Κάποια προϊόντα <strong>ικανοποιούν καλύτερα υπάρχουσες ανάγκες</strong>,
  ενώ άλλα <strong>δημιουργούν νέες ανάγκες</strong>.
  `
},


{
  icon: "👥",

  question: "Πώς η μίμηση δημιουργεί νέες ανάγκες;",

  answer: `
  Οι άνθρωποι έχουν την τάση να
  <strong>μιμούνται τη συμπεριφορά των άλλων</strong>.

  <div class="example">
  🎄 Παράδειγμα: Η κατανάλωση χριστουγεννιάτικων δέντρων
  στην Ελλάδα συνδέθηκε με τη μίμηση εθίμου άλλων χωρών.
  </div>
  `
},


{
  icon: "🔁",

  question: "Πώς η συνήθεια δημιουργεί ανάγκες;",

  answer: `
  Η επαναλαμβανόμενη χρήση ενός αγαθού μπορεί να οδηγήσει
  στην <strong>ανάγκη για το συγκεκριμένο αγαθό</strong>.

  <div class="example">
  «Το συνήθισα και μου έγινε ανάγκη».
  </div>
  `
},


{
  icon: "📢",

  question: "Πώς επηρεάζει η διαφήμιση τις ανάγκες;",

  answer: `
  Η διαφήμιση επιδρά <strong>ψυχολογικά στον καταναλωτή</strong>
  και δημιουργεί επιθυμία απόκτησης αγαθών.

  <div class="example">
  📢 Διαφήμιση → ❤️ Επιθυμία → 🛒 Αγορά → ➕ Νέα ανάγκη
  </div>
  `
},


{
  icon: "🥤",

  question: "Τι σημαίνει κορεσμός μιας ανάγκης;",

  answer: `
  Όσο αυξάνεται η ποσότητα ενός αγαθού που χρησιμοποιείται,
  τόσο <strong>μειώνεται η ένταση της ανάγκης</strong>.

  <br><br>

  Τελικά επέρχεται <strong>πλήρης ικανοποίηση ή κορεσμός</strong>.
  `
},


{
  icon: "💧",

  question: "Ποιο είναι ένα χαρακτηριστικό παράδειγμα κορεσμού;",

  answer: `
  Ένας διψασμένος άνθρωπος πίνει νερό.

  <br><br>

  💧 Με κάθε επιπλέον ποσότητα νερού η ανάγκη μειώνεται,
  μέχρι να <strong>ικανοποιηθεί προσωρινά πλήρως</strong>.
  `
},


{
  icon: "⏳",

  question: "Ο κορεσμός μιας ανάγκης είναι μόνιμος;",

  answer: `
  <strong>Όχι.</strong>

  <br><br>

  Ο κορεσμός είναι <strong>προσωρινός</strong>.
  Η ανάγκη μπορεί να εμφανιστεί ξανά μετά από κάποιο χρονικό διάστημα.
  `
},


{
  icon: "👤",

  question: "Ο κορεσμός επέρχεται με την ίδια ταχύτητα σε όλους τους ανθρώπους;",

  answer: `
  <strong>Όχι.</strong>

  <br><br>

  Η ταχύτητα του κορεσμού είναι
  <strong>υποκειμενική</strong> και διαφέρει από άτομο σε άτομο.
  `
},


{
  icon: "🎯",

  question: "SOS: Πώς θυμόμαστε συνολικά τις ιδιότητες των αναγκών;",

  answer: `
  🔄 <strong>Εξέλιξη:</strong> αλλάζουν τα αγαθά.<br><br>

  ➕ <strong>Πολλαπλασιασμός:</strong> δημιουργούνται νέες ανάγκες.<br><br>

  🥤 <strong>Κορεσμός:</strong> η ένταση μιας ανάγκης μειώνεται προσωρινά όσο αυξάνεται η κατανάλωση.
  `
},


/* ΤΕΛΙΚΗ ΚΑΡΤΑ */

{
  icon: "🎓",

  question: "Ευχαριστώ για την παρακολούθηση!",

  answer: "",

  final: true
}

];


let currentCard = 0;


const flashcard =
document.getElementById("flashcard");

const question =
document.getElementById("question");

const answer =
document.getElementById("answer");

const cardIcon =
document.getElementById("cardIcon");

const flipButton =
document.getElementById("flipButton");

const memoryBox =
document.getElementById("memoryBox");


flashcard.addEventListener("click", function() {

  if (cards[currentCard].final) {
    return;
  }

  flashcard.classList.toggle("flipped");

});


function showCard() {

  flashcard.classList.remove("flipped");

  const current = cards[currentCard];

  question.innerHTML =
    current.question;

  answer.innerHTML =
    current.answer;

  cardIcon.innerHTML =
    current.icon;


  const number =
    currentCard + 1;


  document.getElementById("frontNumber").innerHTML =
    "Κάρτα " + number + " / " + cards.length;


  document.getElementById("backNumber").innerHTML =
    "Κάρτα " + number + " / " + cards.length;


  document.getElementById("progressText").innerHTML =
    "Πρόοδος: " + number + " από " + cards.length;


  const progress =
    (number / cards.length) * 100;


  document.getElementById("progressBar").style.width =
    progress + "%";


  /* ΚΑΝΟΝΙΚΕΣ ΚΑΡΤΕΣ */

  if (!current.final) {

    flashcard.classList.remove("final-card");

    document.querySelector(".card-front").style.background =
      "white";

    document.querySelector(".card-front").style.color =
      "#1f2937";

    document.querySelector(".card-front").style.borderTop =
      "7px solid #2563eb";

    document.querySelector(".card-front .card-number").style.color =
      "#64748b";

    document.querySelector(".flip-hint").style.display =
      "block";

    flipButton.style.display =
      "block";

    memoryBox.style.display =
      "block";

  }


  /* ΤΕΛΙΚΗ ΚΑΡΤΑ */

  else {

    flashcard.classList.add("final-card");

    document.querySelector(".card-front").style.background =
      "#172554";

    document.querySelector(".card-front").style.color =
      "white";

    document.querySelector(".card-front").style.borderTop =
      "7px solid #38bdf8";

    document.querySelector(".card-front .card-number").style.color =
      "#bfdbfe";

    document.querySelector(".flip-hint").style.display =
      "none";

    flipButton.style.display =
      "none";

    memoryBox.style.display =
      "none";


    /* Εμφάνιση ονόματος στην ίδια κάρτα */

    question.innerHTML = `
      <div>
        <div style="
          font-size:30px;
          margin-bottom:30px;
        ">
          Ευχαριστώ για την παρακολούθηση!
        </div>

        <div style="
          font-size:23px;
          font-weight:normal;
        ">
          Ερωτοκριτάκης Κώστας - Οικονομολόγος
        </div>
      </div>
    `;

  }

}


function nextCard() {

  currentCard++;

  if (currentCard >= cards.length) {
    currentCard = 0;
  }

  showCard();
}


function previousCard() {

  currentCard--;

  if (currentCard < 0) {
    currentCard = cards.length - 1;
  }

  showCard();
}


function flipCard(event) {

  event.stopPropagation();

  if (cards[currentCard].final) {
    return;
  }

  flashcard.classList.toggle("flipped");
}


showCard();

</script>

</body>
</html>
