<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Η Έννοια της Παραγωγής & Ο Χρονικός Ορίζοντας της Επιχείρησης</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: white;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .app {
        width: 100%;
        max-width: 850px;
        text-align: center;
    }

    h1 {
        font-size: 28px;
        margin-bottom: 8px;
        line-height: 1.3;
    }

    .subtitle {
        color: #cbd5e1;
        margin-bottom: 25px;
        font-size: 16px;
    }

    .progress-container {
        width: 100%;
        height: 8px;
        background: #334155;
        border-radius: 10px;
        margin-bottom: 15px;
        overflow: hidden;
    }

    .progress {
        height: 100%;
        width: 10%;
        background: #38bdf8;
        transition: width 0.3s ease;
    }

    .counter {
        color: #cbd5e1;
        margin-bottom: 15px;
        font-size: 15px;
    }

    .card-container {
        perspective: 1200px;
        width: 100%;
        height: 480px;
    }

    .card {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.6s;
        cursor: pointer;
    }

    .card.no-flip {
        cursor: default;
    }

    .card.flipped {
        transform: rotateY(180deg);
    }

    .card-side {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 22px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 25px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.35);
        overflow-y: auto;
    }

    .front {
        background: linear-gradient(145deg, #2563eb, #1d4ed8);
    }

    .back {
        background: linear-gradient(145deg, #0f766e, #115e59);
        transform: rotateY(180deg);
    }

    .end-card-style {
        background: linear-gradient(145deg, #0284c7, #0369a1) !important;
    }

    .label {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 2px;
        opacity: 0.8;
        margin-bottom: 15px;
    }

    .question {
        font-size: 23px;
        line-height: 1.4;
        font-weight: bold;
    }

    .answer {
        font-size: 18px;
        line-height: 1.55;
        text-align: left;
        width: 100%;
    }

    .answer-center {
        text-align: center;
    }

    .hint {
        position: absolute;
        bottom: 12px;
        font-size: 13px;
        opacity: 0.7;
    }

    /* QUIZ STYLES */
    .quiz-container {
        text-align: left;
        width: 100%;
    }

    .quiz-title {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 8px;
        text-align: center;
        color: #fde68a;
    }

    .quiz-question {
        font-size: 13px;
        margin-bottom: 4px;
        font-weight: bold;
    }

    .quiz-options {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 8px;
    }

    .quiz-option {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 5px 8px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        transition: 0.2s;
    }

    .quiz-option:hover {
        background: rgba(255, 255, 255, 0.25);
    }

    .quiz-option.correct {
        background: #10b981 !important;
        border-color: #059669;
    }

    .quiz-option.wrong {
        background: #ef4444 !important;
        border-color: #dc2626;
    }

    .quiz-score {
        font-size: 14px;
        font-weight: bold;
        text-align: center;
        margin-top: 4px;
        color: #38bdf8;
    }

    .buttons {
        margin-top: 25px;
        display: flex;
        justify-content: center;
        gap: 15px;
    }

    button {
        border: none;
        border-radius: 12px;
        padding: 13px 25px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        transform: translateY(-2px);
    }

    .prev {
        background: #475569;
        color: white;
    }

    .next {
        background: #38bdf8;
        color: #082f49;
    }

    .reset {
        background: #e2e8f0;
        color: #0f172a;
    }

    .tip {
        margin-top: 20px;
        color: #94a3b8;
        font-size: 14px;
    }

    @media (max-width: 600px) {
        h1 {
            font-size: 22px;
        }

        .card-container {
            height: 450px;
        }

        .question {
            font-size: 17px;
        }

        .card-side {
            padding: 15px;
        }

        button {
            padding: 11px 17px;
            font-size: 14px;
        }
    }
</style>
</head>

<body>

<div class="app">

    <h1>⚙️ Η Έννοια της Παραγωγής & Ο Χρονικός Ορίζοντας</h1>

    <div class="subtitle">
        Flash Cards – Πολιτική Οικονομία
    </div>

    <div class="progress-container">
        <div class="progress" id="progress"></div>
    </div>

    <div class="counter" id="counter">
        Κάρτα 1 από 11
    </div>

    <div class="card-container">

        <div class="card" id="card" onclick="flipCard()">

            <!-- ΜΠΡΟΣΤΑ -->
            <div class="card-side front" id="frontSide">

                <div class="label" id="frontLabel">
                    Ερώτηση
                </div>

                <div class="question" id="question">
                    Φόρτωση...
                </div>

                <div class="hint" id="hint">
                    👆 Κάνε κλικ για να δεις την απάντηση
                </div>

            </div>

            <!-- ΠΙΣΩ -->
            <div class="card-side back">

                <div class="label" id="backLabel">
                    Απάντηση
                </div>

                <div class="answer" id="answer">
                    Φόρτωση...
                </div>

            </div>

        </div>

    </div>

    <div class="buttons">

        <button class="prev" onclick="previousCard(event)">
            ← Προηγούμενη
        </button>

        <button class="reset" onclick="resetCard(event)">
            ↻ Επανάληψη
        </button>

        <button class="next" onclick="nextCard(event)">
            Επόμενη →
        </button>

    </div>

    <div class="tip" id="tipMessage">
        💡 Προσπάθησε να απαντήσεις πριν γυρίσεις την κάρτα. (Χρησιμοποίησε τα βέλη ← → στο πληκτρολόγιο)
    </div>

</div>

<script>

const cards = [
    {
        question: "Πώς ορίζεται η Παραγωγή και τι είναι το Προϊόν;",
        answer: "• <strong>Παραγωγή:</strong> Η διαδικασία με την οποία οι διάφοροι παραγωγικοί συντελεστές μετατρέπονται (μετασχηματίζονται) σε αγαθά χρήσιμα για τον άνθρωπο.<br><br>• Είναι μια <i>συνειδητή προσπάθεια</i> να δοθούν στην ύλη χρήσιμες μορφές που ικανοποιούν ανάγκες.<br><br>• <strong>Προϊόν:</strong> Το αποτέλεσμα της παραγωγικής διαδικασίας."
    },
    {
        question: "Ποια είναι τα 3 χαρακτηριστικά στοιχεία της παραγωγικής διαδικασίας;",
        answer: "1️⃣ <strong>Η συνειδητή προσπάθεια</strong> για κάποιο τελικό αποτέλεσμα.<br><br>2️⃣ <strong>Η χρονική διάρκεια</strong> από τη στιγμή χρησιμοποίησης των συντελεστών μέχρι την παραγωγή του προϊόντος.<br><br>3️⃣ <strong>Η τεχνολογική σχέση</strong> ανάμεσα στις ποσότητες των παραγωγικών συντελεστών και την ποσότητα του παραγόμενου προϊόντος."
    },
    {
        question: "Πώς εφαρμόζονται τα 3 χαρακτηριστικά της παραγωγής σε γεωργία, βιομηχανία και υπηρεσίες;",
        answer: "• <strong>Συνειδητή προσπάθεια:</strong> Παραγωγή σιταριού / κατασκευή αυτοκινήτου / θεραπεία ασθενούς.<br><br>• <strong>Χρονική διάρκεια:</strong> Από την καλλιέργεια έως τη συγκομιδή / από την αρχή έως το τέλος κατασκευής / από την έναρξη της θεραπείας έως την ίαση.<br><br>• <strong>Τεχνολογική σχέση:</strong> Μέθοδος καλλιέργειας σιταριού / μέθοδος παραγωγής αυτοκινήτου / είδος ιατρικής θεραπείας."
    },
    {
        question: "Ποιες οικονομικές δραστηριότητες περιλαμβάνει η παραγωγή;",
        answer: "Η παραγωγή περιλαμβάνει <strong>όλες τις οικονομικές δραστηριότητες</strong>, όπως:<br><br>🌾 Γεωργία<br>🏭 Βιομηχανία<br>🚚 Μεταφορές<br>🛒 Εμπόριο κτλ."
    },
    {
        question: "Πώς ορίζεται η Βραχυχρόνια Περίοδος παραγωγής;",
        answer: "Είναι το χρονικό διάστημα μέσα στο οποίο η επιχείρηση <strong>δεν μπορεί να μεταβάλει</strong> την ποσότητα ενός ή περισσότερων από τους συντελεστές που χρησιμοποιεί.<br><br>👉 Στην περίοδο αυτή άλλοι συντελεστές είναι <strong>σταθεροί</strong> και άλλοι <strong>μεταβλητοί</strong>."
    },
    {
        question: "Τι είναι οι Σταθεροί και τι οι Μεταβλητοί Συντελεστές στη βραχυχρόνια περίοδο;",
        answer: "🔒 <strong>Σταθεροί συντελεστές:</strong> Αυτοί που η ποσότητά τους <u>δεν μπορεί να μεταβληθεί</u> στη βραχυχρόνια περίοδο (π.χ. μηχανήματα, τεχνολογία, γη, κεφαλαιουχικός εξοπλισμός).<br><br>🔄 <strong>Μεταβλητοί συντελεστές:</strong> Αυτοί που η ποσότητά τους <u>μπορεί να αυξομειωθεί</u> (π.χ. πρώτες ύλες, εργασία)."
    },
    {
        question: "Πώς ορίζεται η Μακροχρόνια Περίοδος παραγωγής;",
        answer: "Είναι το χρονικό διάστημα μέσα στο οποίο η επιχείρηση <strong>μπορεί να μεταβάλει τις ποσότητες όλων</strong> των παραγωγικών συντελεστών.<br><br>👉 Στη μακροχρόνια περίοδο <strong>όλοι οι συντελεστές είναι μεταβλητοί</strong>."
    },
    {
        question: "Αντιστοιχεί η διάκριση Βραχυχρόνιας & Μακροχρόνιας περιόδου σε συγκεκριμένο ημερολογιακό χρόνο;",
        answer: "❌ <strong>Όχι!</strong> Η διάκριση <u>δε βασίζεται σε ημερολογιακό χρόνο</u>, αλλά στη δυνατότητα προσαρμοστικότητας των συντελεστών της κάθε επιχείρησης.<br><br>👉 Εξαρτάται από το <strong>αντικείμενο</strong> και το <strong>μέγεθος</strong> της επιχείρησης.<br><i>Παράδειγμα:</i> Μια αυτοκινητοβιομηχανία χρειάζεται πολύ περισσότερο χρόνο για να μεταβάλει όλους τους συντελεστές της απ' ό,τι μια βιομηχανία τροφίμων."
    },
    {
        question: "Σύνοψη: Παραγωγή & Χρονικός Ορίζοντας",
        answer: "🔹 <strong>Παραγωγή:</strong> Μετασχηματισμός συντελεστών σε προϊόν.<br>🔹 <strong>3 Χαρακτηριστικά:</strong> Συνειδητή προσπάθεια, Χρονική διάρκεια, Τεχνολογική σχέση.<br>🔹 <strong>Βραχυχρόνια περίοδος:</strong> Τουλάχιστον ένας συντελεστής ΣΤΑΘΕΡΟΣ.<br>🔹 <strong>Μακροχρόνια περίοδος:</strong> ΟΛΟΙ οι συντελεστές ΜΕΤΑΒΛΗΤΟΙ.<br>🔹 <strong>Κριτήριο διάκρισης:</strong> Η δυνατότητα προσαρμογής των συντελεστών (όχι το ημερολόγιο)."
    },
    {
        isQuiz: true,
        question: `
            <div class="quiz-container">
                <div class="quiz-title">🧠 Mini Κουιζ Κατανόησης (4 Ερωτήσεις)</div>
                
                <div class="quiz-question">1. Τι είναι η παραγωγή;</div>
                <div class="quiz-options" id="q1-opts">
                    <div class="quiz-option" onclick="checkAnswer(event, 1, 0, false)">Α) Μόνο η βιομηχανική κατασκευή</div>
                    <div class="quiz-option" onclick="checkAnswer(event, 1, 1, true)">Β) Μετατροπή συντελεστών σε χρήσιμα αγαθά</div>
                    <div class="quiz-option" onclick="checkAnswer(event, 1, 2, false)">Γ) Η κατανάλωση προϊόντων</div>
                </div>

                <div class="quiz-question">2. Στη βραχυχρόνια περίοδο:</div>
                <div class="quiz-options" id="q2-opts">
                    <div class="quiz-option" onclick="checkAnswer(event, 2, 0, true)">Α) Υπάρχουν σταθεροί και μεταβλητοί συντελεστές</div>
                    <div class="quiz-option" onclick="checkAnswer(event, 2, 1, false)">Β) Όλοι οι συντελεστές είναι μεταβλητοί</div>
                    <div class="quiz-option" onclick="checkAnswer(event, 2, 2, false)">Γ) Κανένας συντελεστής δεν αλλάζει</div>
                </div>

                <div class="quiz-question">3. Σ τη μακροχρόνια περίοδος:</div>
                <div class="quiz-options" id="q3-opts">
                    <div class="quiz-option" onclick="checkAnswer(event, 3, 0, false)">Α) Όλοι οι συντελεστές είναι σταθεροί</div>
                    <div class="quiz-option" onclick="checkAnswer(event, 3, 1, true)">Β) Όλοι οι συντελεστές είναι μεταβλητοί</div>
                    <div class="quiz-option" onclick="checkAnswer(event, 3, 2, false)">Γ) Υπάρχει μόνο ένας σταθερός συντελεστής</div>
                </div>

                <div class="quiz-question">4. Η διάκριση βραχυχρόνιας / μακροχρόνιας περιόδου βασίζεται σε:</div>
                <div class="quiz-options" id="q4-opts">
                    <div class="quiz-option" onclick="checkAnswer(event, 4, 0, false)">Α) Ημερολογιακό χρόνο</div>
                    <div class="quiz-option" onclick="checkAnswer(event, 4, 1, true)">Β) Δυνατότητα προσαρμοστικότητας συντελεστών</div>
                    <div class="quiz-option" onclick="checkAnswer(event, 4, 2, false)">Γ) Τον πληθωρισμό</div>
                </div>

                <div class="quiz-score" id="quizScore">Σκορ: 0 / 4</div>
            </div>
        `,
        answer: ""
    },
    {
        isEndCard: true,
        question: "🎉 Ευχαριστώ για την παρακολούθηση!<br><br><span style='font-size:22px; font-weight:normal;'>Ερωτοκριτάκης Κώστας<br><strong>Οικονομολόγος</strong></span>",
        answer: "🎉 Ευχαριστώ για την παρακολούθηση!<br><br><span style='font-size:22px; font-weight:normal;'>Ερωτοκριτάκης Κώστας<br><strong>Οικονομολόγος</strong></span>"
    }
];

let currentCard = 0;
let quizScoreCount = 0;
let answeredQuestions = {};

const card = document.getElementById("card");
const frontSide = document.getElementById("frontSide");
const question = document.getElementById("question");
const answer = document.getElementById("answer");
const counter = document.getElementById("counter");
const progress = document.getElementById("progress");
const frontLabel = document.getElementById("frontLabel");
const hint = document.getElementById("hint");
const tipMessage = document.getElementById("tipMessage");

function updateCard() {
    card.classList.remove("flipped");

    const currentData = cards[currentCard];

    question.innerHTML = currentData.question;
    answer.innerHTML = currentData.answer;

    if (currentData.isEndCard || currentData.isQuiz) {
        answer.classList.add("answer-center");
    } else {
        answer.classList.remove("answer-center");
    }

    counter.innerHTML = "Κάρτα " + (currentCard + 1) + " από " + cards.length;

    const percentage = ((currentCard + 1) / cards.length) * 100;
    progress.style.width = percentage + "%";

    if (currentData.isEndCard || currentData.isQuiz) {
        frontLabel.style.display = "none";
        hint.style.display = "none";
        tipMessage.style.visibility = "hidden";
        card.classList.add("no-flip");
        
        if (currentData.isQuiz) {
            frontSide.style.background = "linear-gradient(145deg, #1e3a8a, #1e40af)";
        } else {
            frontSide.classList.add("end-card-style");
        }
    } else {
        frontLabel.style.display = "block";
        hint.style.display = "block";
        tipMessage.style.visibility = "visible";
        card.classList.remove("no-flip");
        frontSide.classList.remove("end-card-style");
        frontSide.style.background = "linear-gradient(145deg, #2563eb, #1d4ed8)";
    }
}

function checkAnswer(event, qNum, optIndex, isCorrect) {
    if (event) event.stopPropagation();
    if (answeredQuestions[qNum]) return;
    answeredQuestions[qNum] = true;

    const containerId = "q" + qNum + "-opts";
    const options = document.getElementById(containerId).children;

    for (let i = 0; i < options.length; i++) {
        if (i === optIndex) {
            options[i].classList.add(isCorrect ? "correct" : "wrong");
        } else if (options[i].getAttribute("onclick").includes("true")) {
            options[i].classList.add("correct");
        }
        options[i].style.pointerEvents = "none";
    }

    if (isCorrect) {
        quizScoreCount++;
    }
    document.getElementById("quizScore").innerHTML = "Σκορ: " + quizScoreCount + " / 4";
}

function flipCard() {
    if (!cards[currentCard].isEndCard && !cards[currentCard].isQuiz) {
        card.classList.toggle("flipped");
    }
}

function nextCard(event) {
    if (event) event.stopPropagation();
    currentCard++;
    if (currentCard >= cards.length) {
        currentCard = 0;
    }
    updateCard();
}

function previousCard(event) {
    if (event) event.stopPropagation();
    currentCard--;
    if (currentCard < 0) {
        currentCard = cards.length - 1;
    }
    updateCard();
}

function resetCard(event) {
    if (event) event.stopPropagation();
    currentCard = 0;
    quizScoreCount = 0;
    answeredQuestions = {};
    updateCard();
}

// Keyboard Navigation
document.addEventListener("keydown", function(event) {
    if (event.key === "ArrowRight") {
        nextCard();
    } else if (event.key === "ArrowLeft") {
        previousCard();
    } else if (event.key === " " || event.key === "Enter") {
        event.preventDefault();
        flipCard();
    }
});

updateCard();

</script>

</body>
</html>
