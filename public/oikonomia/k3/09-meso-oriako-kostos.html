<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Μέσο και Οριακό Κόστος - Πολιτική Οικονομία</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: white;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .app {
        width: 100%;
        max-width: 850px;
        text-align: center;
    }

    h1 {
        font-size: 26px;
        margin-bottom: 8px;
        line-height: 1.3;
    }

    .subtitle {
        color: #cbd5e1;
        margin-bottom: 25px;
        font-size: 16px;
    }

    .progress-container {
        width: 100%;
        height: 8px;
        background: #334155;
        border-radius: 10px;
        margin-bottom: 15px;
        overflow: hidden;
    }

    .progress {
        height: 100%;
        width: 10%;
        background: #38bdf8;
        transition: width 0.3s ease;
    }

    .counter {
        color: #cbd5e1;
        margin-bottom: 15px;
        font-size: 15px;
    }

    .card-container {
        perspective: 1200px;
        width: 100%;
        height: 480px;
    }

    .card {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.6s;
        cursor: pointer;
    }

    .card.no-flip {
        cursor: default;
    }

    .card.flipped {
        transform: rotateY(180deg);
    }

    .card-side {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 22px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 25px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.35);
        overflow-y: auto;
    }

    .front {
        background: linear-gradient(145deg, #2563eb, #1d4ed8);
    }

    .back {
        background: linear-gradient(145deg, #0f766e, #115e59);
        transform: rotateY(180deg);
    }

    .end-card-style {
        background: linear-gradient(145deg, #0284c7, #0369a1) !important;
    }

    .label {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 2px;
        opacity: 0.8;
        margin-bottom: 15px;
    }

    .question {
        font-size: 22px;
        line-height: 1.4;
        font-weight: bold;
    }

    .answer {
        font-size: 16px;
        line-height: 1.5;
        text-align: left;
        width: 100%;
    }

    .answer-center {
        text-align: center;
    }

    .hint {
        position: absolute;
        bottom: 12px;
        font-size: 13px;
        opacity: 0.7;
    }

    /* QUIZ STYLES */
    .quiz-container {
        text-align: left;
        width: 100%;
    }

    .quiz-title {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 8px;
        text-align: center;
        color: #fde68a;
    }

    .quiz-question {
        font-size: 13px;
        margin-bottom: 4px;
        font-weight: bold;
    }

    .quiz-options {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 8px;
    }

    .quiz-option {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 5px 8px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        transition: 0.2s;
    }

    .quiz-option:hover {
        background: rgba(255, 255, 255, 0.25);
    }

    .quiz-option.correct {
        background: #10b981 !important;
        border-color: #059669;
    }

    .quiz-option.wrong {
        background: #ef4444 !important;
        border-color: #dc2626;
    }

    .quiz-score {
        font-size: 14px;
        font-weight: bold;
        text-align: center;
        margin-top: 4px;
        color: #38bdf8;
    }

    .buttons {
        margin-top: 25px;
        display: flex;
        justify-content: center;
        gap: 15px;
    }

    button {
        border: none;
        border-radius: 12px;
        padding: 13px 25px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        transform: translateY(-2px);
    }

    .prev {
        background: #475569;
        color: white;
    }

    .next {
        background: #38bdf8;
        color: #082f49;
    }

    .reset {
        background: #e2e8f0;
        color: #0f172a;
    }

    .tip {
        margin-top: 20px;
        color: #94a3b8;
        font-size: 14px;
    }

    @media (max-width: 600px) {
        h1 {
            font-size: 20px;
        }

        .card-container {
            height: 460px;
        }

        .question {
            font-size: 17px;
        }

        .card-side {
            padding: 15px;
        }

        button {
            padding: 11px 17px;
            font-size: 14px;
        }
    }
</style>
</head>

<body>

<div class="app">

    <h1>3. Μέσο Κόστος & 4. Οριακό Κόστος</h1>

    <div class="subtitle">
        Flash Cards – Πολιτική Οικονομία
    </div>

    <div class="progress-container">
        <div class="progress" id="progress"></div>
    </div>

    <div class="counter" id="counter">
        Κάρτα 1 από 10
    </div>

    <div class="card-container">

        <div class="card" id="card" onclick="flipCard()">

            <!-- ΜΠΡΟΣΤΑ -->
            <div class="card-side front" id="frontSide">

                <div class="label" id="frontLabel">
                    Ερώτηση
                </div>

                <div class="question" id="question">
                    Φόρτωση...
                </div>

                <div class="hint" id="hint">
                    👆 Κάνε κλικ για να δεις την απάντηση
                </div>

            </div>

            <!-- ΠΙΣΩ -->
            <div class="card-side back">

                <div class="label" id="backLabel">
                    Απάντηση
                </div>

                <div class="answer" id="answer">
                    Φόρτωση...
                </div>

            </div>

        </div>

    </div>

    <div class="buttons">

        <button class="prev" onclick="previousCard(event)">
            ← Προηγούμενη
        </button>

        <button class="reset" onclick="resetCard(event)">
            ↻ Επανάληψη
        </button>

        <button class="next" onclick="nextCard(event)">
            Επόμενη →
        </button>

    </div>

    <div class="tip" id="tipMessage">
        💡 Προσπάθησε να απαντήσεις πριν γυρίσεις την κάρτα. (Χρησιμοποίησε τα βέλη ← → στο πληκτρολόγιο)
    </div>

</div>

<script>

const cards = [
    {
        question: "Τι είναι το Μέσο Κόστος και ποια είναι τα τρία είδη του στη βραχυχρόνια περίοδο;",
        answer: "• Μέσο Κόστος είναι ο λόγος του κόστους προς την αντίστοιχη ποσότητα προϊόντος (το κατά μονάδα προϊόντος κόστος).<br><br>• Τα τρία είδη είναι: Μέσο Σταθερό Κόστος (AFC), Μέσο Μεταβλητό Κόστος (AVC) και Μέσο Συνολικό Κόστος (ATC)."
    },
    {
        question: "Ποιοι είναι οι τύποι υπολογισμού των τριών μέσων μεγεθών κόστους;",
        answer: "• Μέσο Σταθερό Κόστος: AFC = FC / Q<br>• Μέσο Μεταβλητό Κόστος: AVC = VC / Q<br>• Μέσο Συνολικό Κόστος: ATC = TC / Q<br><br>👉 Επίσης ισχύει: ATC = AFC + AVC"
    },
    {
        question: "Πώς συμπεριφέρεται η καμπύλη του Μέσου Σταθερού Κόστους (AFC) καθώς αυξάνεται η παραγωγή;",
        answer: "Το μέσο σταθερό κόστος μειώνεται συνεχώς όσο αυξάνεται η παραγωγή, γιατί η ίδια σταθερή δαπάνη επιμερίζεται (κατανέμεται) σε περισσότερες μονάδες προϊόντος."
    },
    {
        question: "Πώς συμπεριφέρεται η καμπύλη του Μέσου Μεταβλητού Κόστους (AVC) και γιατί;",
        answer: "• Στην αρχή μειώνεται και στη συνέχεια αυξάνεται, αποκτώντας σχήμα λατινικού U.<br><br>• Αυτό οφείλεται στο νόμο της φθίνουσας απόδοσης: αρχικά το προϊόν αυξάνεται με γρηγορότερο ρυθμό από το κόστος των μεταβλητών συντελεστών (το AVC μειώνεται), ενώ στη συνέχεια ο ρυθμός αύξησης του προϊόντος γίνεται μικρότερος (το AVC αυξάνεται)."
    },
    {
        question: "Πώς διαμορφώνεται η καμπύλη του Μέσου Συνολικού Κόστους (ATC);",
        answer: "Έχει επίσης σχήμα λατινικού U. Στην αρχή επηρεάζεται κυρίως από τη σημαντική μείωση του μέσου σταθερού κόστους, ενώ όσο η παραγωγή αυξάνεται, η σημασία του AFC μειώνεται και το ATC επηρεάζεται κυρίως από το μέσο μεταβλητό κόστος, ακολουθώντας την ίδια ανοδική πορεία."
    },
    {
        question: "Τι είναι το Οριακό Κόστος (MC) και ποιοι είναι οι τύποι υπολογισμού του;",
        answer: "• Δείχνει το ρυθμό με τον οποίο μεταβάλλεται το συνολικό κόστος, όταν μεταβάλλεται η παραγωγή κατά μία μονάδα.<br><br>• Τύποι: MC = Δ(TC) / ΔQ ή MC = Δ(VC) / ΔQ (επειδή στη μεταβολή του συνολικού κόστους συμμετέχει μόνο το μεταβλητό κόστος)."
    },
    {
        question: "Ποια είναι η μορφή της καμπύλης του Οριακού Κόστους (MC) και γιατί είναι σημαντικό μέγεθος;",
        answer: "• Αρχικά κατέρχεται, φθάνει σε ένα κατώτατο σημείο και στη συνέχεια ανέρχεται (λόγω του νόμου της φθίνουσας απόδοσης).<br><br>• Είναι σημαντικό γιατί η επιχείρηση αποφασίζει αν θα αυξήσει την παραγωγή της κατά μία μονάδα συγκρίνοντας το κόστος αυτής της μονάδας (MC) με το έσοδο από την πώλησή της."
    },
    {
        question: "Σύνοψη: Μέσο & Οριακό Κόστος στη Βραχυχρόνια Περίοδο",
        answer: "🔹 AFC = FC / Q (μειώνεται συνεχώς).<br>🔹 AVC = VC / Q (σχήμα U λόγω φθίνουσας απόδοσης).<br>🔹 ATC = TC / Q = AFC + AVC (σχήμα U).<br>🔹 MC = Δ(TC) / ΔQ = Δ(VC) / ΔQ (αρχικά μειώνεται, φτάνει στο ελάχιστο και μετά αυξάνεται).<br>🔹 Το MC μεταβάλλεται πιο έντονα από το AVC γιατί επηρεάζεται μόνο από την τελευταία μεταβολή."
    },
    {
        isQuiz: true,
        question: `
            <div class="quiz-container">
                <div class="quiz-title">Mini Κουιζ Κατανόησης (4 Ερωτήσεις)</div>
                
                <div class="quiz-question">1. Πώς συμπεριφέρεται το Μέσο Σταθερό Κόστος (AFC) όσο αυξάνεται η παραγωγή;</div>
                <div class="quiz-options" id="q1-opts">
                    <div class="quiz-option" onclick="checkAnswer(event, 1, 0, false)">Α) Αυξάνεται συνεχώς</div>
                    <div class="quiz-option" onclick="checkAnswer(event, 1, 1, true)">Β) Μειώνεται συνεχώς</div>
                    <div class="quiz-option" onclick="checkAnswer(event, 1, 2, false)">Γ) Παραμένει απολύτως σταθερό</div>
                </div>

                <div class="quiz-question">2. Σε ποιον νόμο οφείλεται το σχήμα U των καμπυλών AVC, ATC και MC;</div>
                <div class="quiz-options" id="q2-opts">
                    <div class="quiz-option" onclick="checkAnswer(event, 2, 0, true)">Α) Στο νόμο της φθίνουσας ή μη ανάλογης απόδοσης</div>
                    <div class="quiz-option" onclick="checkAnswer(event, 2, 1, false)">Β) Στο νόμο της ζήτησης</div>
                    <div class="quiz-option" onclick="checkAnswer(event, 2, 2, false)">Γ) Στο νόμο της προσφοράς</div>
                </div>

                <div class="quiz-question">3. Γιατί το Οριακό Κόστος υπολογίζεται και με τον τύπο MC = Δ(VC) / ΔQ;</div>
                <div class="quiz-options" id="q3-opts">
                    <div class="quiz-option" onclick="checkAnswer(event, 3, 0, false)">Α) Επειδή το σταθερό κόστος αυξάνεται με την παραγωγή</div>
                    <div class="quiz-option" onclick="checkAnswer(event, 3, 1, true)">Β) Επειδή στη μεταβολή του συνολικού κόστους συμμετέχει μόνο το μεταβλητό κόστος</div>
                    <div class="quiz-option" onclick="checkAnswer(event, 3, 2, false)">Γ) Επειδή το μεταβλητό κόστος είναι πάντα μηδέν</div>
                </div>

                <div class="quiz-question">4. Με τι συγκρίνει η επιχείρηση το Οριακό Κόστος για να αποφασίσει την αύξηση της παραγωγής κατά μία μονάδα;</div>
                <div class="quiz-options" id="q4-opts">
                    <div class="quiz-option" onclick="checkAnswer(event, 4, 0, false)">Α) Με το μέσο σταθερό κόστος</div>
                    <div class="quiz-option" onclick="checkAnswer(event, 4, 1, false)">Β) Μόνο με το συνολικό κόστος</div>
                    <div class="quiz-option" onclick="checkAnswer(event, 4, 2, true)">Γ) Με το έσοδο από την πώληση αυτής της μονάδας</div>
                </div>

                <div class="quiz-score" id="quizScore">Σκορ: 0 / 4</div>
            </div>
        `,
        answer: ""
    },
    {
        isEndCard: true,
        question: "Ευχαριστώ για την παρακολούθηση!<br><br><span style='font-size:22px; font-weight:normal;'>Ερωτοκριτάκης Κώστας<br>Οικονομολόγος</span>",
        answer: "Ευχαριστώ για την παρακολούθηση!<br><br><span style='font-size:22px; font-weight:normal;'>Ερωτοκριτάκης Κώστας<br>Οικονομολόγος</span>"
    }
];

let currentCard = 0;
let quizScoreCount = 0;
let answeredQuestions = {};

const card = document.getElementById("card");
const frontSide = document.getElementById("frontSide");
const question = document.getElementById("question");
const answer = document.getElementById("answer");
const counter = document.getElementById("counter");
const progress = document.getElementById("progress");
const frontLabel = document.getElementById("frontLabel");
const hint = document.getElementById("hint");
const tipMessage = document.getElementById("tipMessage");

function updateCard() {
    card.classList.remove("flipped");

    const currentData = cards[currentCard];

    question.innerHTML = currentData.question;
    answer.innerHTML = currentData.answer;

    if (currentData.isEndCard || currentData.isQuiz) {
        answer.classList.add("answer-center");
    } else {
        answer.classList.remove("answer-center");
    }

    counter.innerHTML = "Κάρτα " + (currentCard + 1) + " από " + cards.length;

    const percentage = ((currentCard + 1) / cards.length) * 100;
    progress.style.width = percentage + "%";

    if (currentData.isEndCard || currentData.isQuiz) {
        frontLabel.style.display = "none";
        hint.style.display = "none";
        tipMessage.style.visibility = "hidden";
        card.classList.add("no-flip");
        
        if (currentData.isQuiz) {
            frontSide.style.background = "linear-gradient(145deg, #1e3a8a, #1e40af)";
        } else {
            frontSide.classList.add("end-card-style");
        }
    } else {
        frontLabel.style.display = "block";
        hint.style.display = "block";
        tipMessage.style.visibility = "visible";
        card.classList.remove("no-flip");
        frontSide.classList.remove("end-card-style");
        frontSide.style.background = "linear-gradient(145deg, #2563eb, #1d4ed8)";
    }
}

function checkAnswer(event, qNum, optIndex, isCorrect) {
    if (event) event.stopPropagation();
    if (answeredQuestions[qNum]) return;
    answeredQuestions[qNum] = true;

    const containerId = "q" + qNum + "-opts";
    const options = document.getElementById(containerId).children;

    for (let i = 0; i < options.length; i++) {
        if (i === optIndex) {
            options[i].classList.add(isCorrect ? "correct" : "wrong");
        } else if (options[i].getAttribute("onclick").includes("true")) {
            options[i].classList.add("correct");
        }
        options[i].style.pointerEvents = "none";
    }

    if (isCorrect) {
        quizScoreCount++;
    }
    document.getElementById("quizScore").innerHTML = "Σκορ: " + quizScoreCount + " / 4";
}

function flipCard() {
    if (!cards[currentCard].isEndCard && !cards[currentCard].isQuiz) {
        card.classList.toggle("flipped");
    }
}

function nextCard(event) {
    if (event) event.stopPropagation();
    currentCard++;
    if (currentCard >= cards.length) {
        currentCard = 0;
    }
    updateCard();
}

function previousCard(event) {
    if (event) event.stopPropagation();
    currentCard--;
    if (currentCard < 0) {
        currentCard = cards.length - 1;
    }
    updateCard();
}

function resetCard(event) {
    if (event) event.stopPropagation();
    currentCard = 0;
    quizScoreCount = 0;
    answeredQuestions = {};
    updateCard();
}

// Keyboard Navigation
document.addEventListener("keydown", function(event) {
    if (event.key === "ArrowRight") {
        nextCard();
    } else if (event.key === "ArrowLeft") {
        previousCard();
    } else if (event.key === " " || event.key === "Enter") {
        event.preventDefault();
        flipCard();
    }
});

updateCard();

</script>

</body>
</html>
