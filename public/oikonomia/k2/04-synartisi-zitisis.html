<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Η Συνάρτηση Ζήτησης - Πολιτική Οικονομία</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: white;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .app {
        width: 100%;
        max-width: 850px;
        text-align: center;
    }

    h1 {
        font-size: 30px;
        margin-bottom: 8px;
    }

    .subtitle {
        color: #cbd5e1;
        margin-bottom: 25px;
        font-size: 17px;
    }

    .progress-container {
        width: 100%;
        height: 8px;
        background: #334155;
        border-radius: 10px;
        margin-bottom: 15px;
        overflow: hidden;
    }

    .progress {
        height: 100%;
        width: 10%;
        background: #38bdf8;
        transition: width 0.3s ease;
    }

    .counter {
        color: #cbd5e1;
        margin-bottom: 15px;
        font-size: 15px;
    }

    .card-container {
        perspective: 1200px;
        width: 100%;
        height: 450px;
    }

    .card {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.6s;
        cursor: pointer;
    }

    .card.no-flip {
        cursor: default;
    }

    .card.flipped {
        transform: rotateY(180deg);
    }

    .card-side {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 22px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 35px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.35);
        overflow-y: auto;
    }

    .front {
        background: linear-gradient(145deg, #2563eb, #1d4ed8);
    }

    .back {
        background: linear-gradient(145deg, #0f766e, #115e59);
        transform: rotateY(180deg);
    }

    .end-card-style {
        background: linear-gradient(145deg, #0284c7, #0369a1) !important;
    }

    .label {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 2px;
        opacity: 0.8;
        margin-bottom: 20px;
    }

    .question {
        font-size: 26px;
        line-height: 1.4;
        font-weight: bold;
    }

    .answer {
        font-size: 19px;
        line-height: 1.55;
        text-align: left;
        width: 100%;
    }

    .answer-center {
        text-align: center;
    }

    .hint {
        position: absolute;
        bottom: 18px;
        font-size: 13px;
        opacity: 0.7;
    }

    .buttons {
        margin-top: 25px;
        display: flex;
        justify-content: center;
        gap: 15px;
    }

    button {
        border: none;
        border-radius: 12px;
        padding: 13px 25px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        transform: translateY(-2px);
    }

    .prev {
        background: #475569;
        color: white;
    }

    .next {
        background: #38bdf8;
        color: #082f49;
    }

    .reset {
        background: #e2e8f0;
        color: #0f172a;
    }

    .tip {
        margin-top: 20px;
        color: #94a3b8;
        font-size: 14px;
    }

    @media (max-width: 600px) {
        h1 {
            font-size: 24px;
        }

        .card-container {
            height: 420px;
        }

        .question {
            font-size: 21px;
        }

        .answer {
            font-size: 16px;
        }

        .card-side {
            padding: 20px;
        }

        button {
            padding: 11px 17px;
            font-size: 14px;
        }
    }
</style>
</head>

<body>

<div class="app">

    <h1>📈 Η Συνάρτηση Ζήτησης</h1>

    <div class="subtitle">
        Flash Cards – Επιμέλεια: Ερωτοκριτάκης Κώστας (Οικονομολόγος)
    </div>

    <div class="progress-container">
        <div class="progress" id="progress"></div>
    </div>

    <div class="counter" id="counter">
        Κάρτα 1 από 8
    </div>

    <div class="card-container">

        <div class="card" id="card" onclick="flipCard()">

            <!-- ΜΠΡΟΣΤΑ -->
            <div class="card-side front" id="frontSide">

                <div class="label" id="frontLabel">
                    Ερώτηση
                </div>

                <div class="question" id="question">
                    Φόρτωση...
                </div>

                <div class="hint" id="hint">
                    👆 Κάνε κλικ για να δεις την απάντηση
                </div>

            </div>

            <!-- ΠΙΣΩ -->
            <div class="card-side back">

                <div class="label" id="backLabel">
                    Απάντηση
                </div>

                <div class="answer" id="answer">
                    Φόρτωση...
                </div>

            </div>

        </div>

    </div>

    <div class="buttons">

        <button class="prev" onclick="previousCard(event)">
            ← Προηγούμενη
        </button>

        <button class="reset" onclick="resetCard(event)">
            ↻ Επανάληψη
        </button>

        <button class="next" onclick="nextCard(event)">
            Επόμενη →
        </button>

    </div>

    <div class="tip" id="tipMessage">
        💡 Προσπάθησε να απαντήσεις πριν γυρίσεις την κάρτα.
    </div>

</div>

<script>

const cards = [
    {
        question: "Τι σημαίνει η έκφραση «ceteris paribus» στην οικονομική επιστήμη;",
        answer: "Σημαίνει <strong>«τα άλλα ίσα ή σταθερά»</strong>. Δηλαδή, όταν μελετάμε τη σχέση τιμής και ζητούμενης ποσότητας, δεχόμαστε ότι όλοι οι άλλοι προσδιοριστικοί παράγοντες της ζήτησης (π.χ. εισόδημα, προτιμήσεις) παραμένουν σταθεροί."
    },
    {
        question: "Ποια είναι η γενική μορφή της συνάρτησης ζήτησης;",
        answer: "• <strong>Τύπος:</strong> Q<sub>D</sub> = f(P)<br><br>Όπου:<br>• <strong>Q<sub>D</sub>:</strong> η ζητούμενη ποσότητα<br>• <strong>P:</strong> η τιμή του προϊόντος"
    },
    {
        question: "Ποιος είναι ο τύπος της γραμμικής συνάρτησης ζήτησης και τι εκφράζουν οι σταθερές α και β;",
        answer: "• <strong>Τύπος:</strong> Q<sub>D</sub> = α + βP<br><br>• <strong>α:</strong> θετικός αριθμός (α > 0).<br>• <strong>β:</strong> ο συντελεστής κλίσης της ευθείας, είναι πάντα <strong>αρνητικός αριθμός (β < 0)</strong>, διότι εκφράζει την αρνητική σχέση μεταξύ ζητούμενης ποσότητας και τιμής (Νόμος Ζήτησης)."
    },
    {
        question: "Ποιοι περιορισμοί ισχύουν για τις τιμές Q<sub>D</sub> και P σε μια συνάρτηση ζήτησης;",
        answer: "Δεδομένου ότι η ζητούμενη ποσότητα και η τιμή δεν μπορούν να πάρουν αρνητικές τιμές, ισχύει πάντα ότι: <strong>Q<sub>D</sub> ≥ 0</strong> και <strong>P ≥ 0</strong>."
    },
    {
        question: "Ποια είναι η μορφή της συνάρτησης ζήτησης όταν η γραφική της παράσταση είναι ισοσκελής υπερβολή;",
        answer: "• <strong>Τύπος:</strong> Q<sub>D</sub> = A / P<br><br>Όπου <strong>A</strong> είναι ένας σταθερός θετικός αριθμός (A > 0). Το διάγραμμα έχει ασύμπτωτους τους άξονες Q<sub>D</sub> και P."
    },
    {
        question: "Ποιο είναι το βασικό χαρακτηριστικό της συνάρτησης ζήτησης της μορφής Q<sub>D</sub> = A / P;",
        answer: "Το χαρακτηριστικό της είναι ότι η <strong>συνολική δαπάνη (ΣΔ) των καταναλωτών</strong> για το προϊόν είναι <strong>σταθερή</strong> σε όλα τα σημεία της καμπύλης, διότι:<br><br><strong>ΣΔ = Q<sub>D</sub> · P = A</strong>"
    },
    {
        question: " Σύνοψη: Ποιες είναι οι δύο βασικές αλγεβρικές μορφές της συνάρτησης ζήτησης;",
        answer: "1️⃣ <strong>Γραμμική:</strong> Q<sub>D</sub> = α + βP (γραφική παράσταση: ευθεία γραμμή).<br>2️⃣ <strong>Ισοσκελής Υπερβολή:</strong> Q<sub>D</sub> = A / P (σταθερή συνολική δαπάνη P·Q<sub>D</sub> = A)."
    },
    {
        isEndCard: true,
        question: "🎉 Ευχαριστώ πολύ για την παρακολούθηση!<br><br><span style='font-size:22px; font-weight:normal;'>Ερωτοκριτάκης Κώστας - <strong>Οικονομολόγος</strong></span>",
        answer: "🎉 Ευχαριστώ πολύ για την παρακολούθηση!<br><br><span style='font-size:22px; font-weight:normal;'>Ερωτοκριτάκης Κώστας - <strong>Οικονομολόγος</strong></span>"
    }
];

let currentCard = 0;

const card = document.getElementById("card");
const frontSide = document.getElementById("frontSide");
const question = document.getElementById("question");
const answer = document.getElementById("answer");
const counter = document.getElementById("counter");
const progress = document.getElementById("progress");
const frontLabel = document.getElementById("frontLabel");
const hint = document.getElementById("hint");
const tipMessage = document.getElementById("tipMessage");

function updateCard() {
    card.classList.remove("flipped");

    const currentData = cards[currentCard];

    question.innerHTML = currentData.question;
    answer.innerHTML = currentData.answer;

    if (currentData.isEndCard) {
        answer.classList.add("answer-center");
    } else {
        answer.classList.remove("answer-center");
    }

    counter.innerHTML = "Κάρτα " + (currentCard + 1) + " από " + cards.length;

    const percentage = ((currentCard + 1) / cards.length) * 100;
    progress.style.width = percentage + "%";

    if (currentData.isEndCard) {
        frontLabel.style.display = "none";
        hint.style.display = "none";
        tipMessage.style.visibility = "hidden";
        card.classList.add("no-flip");
        frontSide.classList.add("end-card-style");
    } else {
        frontLabel.style.display = "block";
        hint.style.display = "block";
        tipMessage.style.visibility = "visible";
        card.classList.remove("no-flip");
        frontSide.classList.remove("end-card-style");
    }
}

function flipCard() {
    if (!cards[currentCard].isEndCard) {
        card.classList.toggle("flipped");
    }
}

function nextCard(event) {
    if (event) event.stopPropagation();
    currentCard++;
    if (currentCard >= cards.length) {
        currentCard = 0;
    }
    updateCard();
}

function previousCard(event) {
    if (event) event.stopPropagation();
    currentCard--;
    if (currentCard < 0) {
        currentCard = cards.length - 1;
    }
    updateCard();
}

function resetCard(event) {
    if (event) event.stopPropagation();
    currentCard = 0;
    updateCard();
}

updateCard();

</script>

</body>
</html>
